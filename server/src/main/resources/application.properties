# ===================================================================
# Configurazione Generale dell'Applicazione
# ===================================================================
spring.application.name=server
server.port=8080

# ===================================================================
# Configurazione Database (SQLite)
# ===================================================================
# Specifica il percorso del file del database (verrà creato nella root del progetto)
spring.datasource.url=jdbc:sqlite:likepenguins_db.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ===================================================================
# Configurazione JPA / Hibernate 7+
# ===================================================================
# Forza l'uso del dialetto SQLite preso dal pacchetto community-dialects
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Aggiorna automaticamente lo schema del database in base alle classi Entity Java
spring.jpa.hibernate.ddl-auto=update

# Mostra le query SQL nel terminale (comodo per il debug in sviluppo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Configurazione HTTPS (SSL/TLS)
# ===================================================================
# Attiva la modalità HTTPS
server.ssl.enabled=true

# Dice a Spring Boot dove trovare il file del certificato
server.ssl.key-store=classpath:keystore.p12

# Il formato del file (PKCS12 è lo standard per i file .p12)
server.ssl.key-store-type=PKCS12

# L'alias che abbiamo associato al certificato
server.ssl.key-alias=likepenguins

# La password che hai usato per generare il keystore
